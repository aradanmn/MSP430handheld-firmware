# Lesson 01 concept-check quiz — see CLAUDE.md's Exercise Format Policy,
# "Quiz" row. Unlike ex1-3, this file's answers are meant to be visible
# (in the [explain] text, shown after answering) — it checks understanding
# of the tutorials' reasoning, not exercise/milestone implementation.
# Retake as many times as you want; nothing here is graded by Claude.

[quiz]
lesson = "lesson-01-architecture"

questions = [
  { id = 1, prompt = "Why must SP be set to 0x0400 before anything else runs in _start?", choices = ["Because RAM itself starts at address 0x0400", "Because 0x0400 is one byte past the top of RAM, so the downward-growing stack starts safely inside RAM", "Because the reset vector points to 0x0400", "Because WDTCTL requires SP to be set first"], answer = 1, explain = "RAM spans 0x0200-0x03FF. SP is set to 0x0400 so the first push lands at 0x03FE, safely inside RAM. If a call or interrupt fired before SP were initialized, it would push to an undefined garbage address." },
  { id = 2, prompt = "Why is WDTHOLD written as the very second instruction, right after SP init, instead of later?", choices = ["The watchdog is already counting down from power-up with a short default interval, so anything that runs first risks an unheld reset", "The DCO cannot be calibrated while the watchdog is unheld", "It is purely a style convention with no functional effect", "WDTCTL can only be written once per program, so it must come first"], answer = 0, explain = "The WDT starts counting the moment the chip powers up. Its default interval is short, so delaying WDTHOLD risks the chip resetting mid-setup. Holding it early, right after SP, means nothing else runs at risk." },
  { id = 3, prompt = "You forgot to write WDTHOLD at all. What symptom would you most likely observe on the LaunchPad?", choices = ["The program fails to compile", "LED1 blinks at exactly double the intended rate", "The program appears to restart itself repeatedly, never getting past its init sequence", "The DCO permanently calibrates to the wrong frequency"], answer = 2, explain = "An unheld watchdog resets the chip on a short interval, over and over. The observable symptom is a program that looks like it keeps restarting partway through - not a compile error and not a frequency problem." },
  { id = 4, prompt = "In the DCO calibration sequence, why clear DCOCTL before loading BCSCTL1 with the calibration byte?", choices = ["So the new coarse-range byte never briefly combines with a stale, mismatched fine-tune value", "DCOCTL must be zero whenever the CPU is running", "It has no real effect; it is done only for symmetry", "BCSCTL1 cannot be written while DCOCTL is nonzero"], answer = 0, explain = "BCSCTL1's coarse range and DCOCTL's fine-tune jointly set the DCO frequency. Clearing DCOCTL first means the coarse-range load always combines with a known, quiet value instead of whatever fine-tune value was left over." },
  { id = 5, prompt = "What does the WDTPW password mechanism protect against?", choices = ["A runaway or corrupted program accidentally disabling the watchdog - a wrong password triggers an immediate reset instead of being ignored", "Unauthorized access from other devices on a network", "Nothing on this chip; it is a legacy field with no effect", "It only matters for the very first write to WDTCTL, not later ones"], answer = 0, explain = "WDTCTL rejects any write whose upper byte isn't 0x5A - and rejection means an immediate reset, not a silent no-op. That makes it impossible for a corrupted PC to accidentally disable the watchdog by landing on the wrong bit pattern. Every future write to WDTCTL needs the password too, not just the first one." },
  { id = 6, prompt = "Which register holds the CPU flags (Zero, Carry, Negative, Overflow) and the low-power-mode control bits like CPUOFF?", choices = ["R0 (PC)", "R1 (SP)", "R2 (SR)", "R3 (CG)"], answer = 2, explain = "R2 is the Status Register: it holds the arithmetic flags plus GIE, CPUOFF, and the other low-power-mode bits." },
]
